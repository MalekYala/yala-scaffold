name: <name> CI (worker, python)

on:
  push:
    branches: [main, "bot/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps + mypy
        run: |
          pip install --quiet -r requirements.txt -r requirements-dev.txt
      - name: mypy (strict, per pyproject.toml)
        run: mypy .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        run: pip install --quiet -r requirements.txt -r requirements-dev.txt
      - name: pytest
        run: pytest -q tests/

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        shell: bash
        run: |
          # Install gitleaks CLI directly — gitleaks/gitleaks-action@v2 now
          # requires a paid GITLEAKS_LICENSE secret, but the underlying CLI
          # remains open-source under an MIT license.
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) ARCH=x64 ;;
            aarch64|arm64) ARCH=arm64 ;;
          esac
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_${ARCH}.tar.gz" \
            | tar -xzC /tmp gitleaks
          /tmp/gitleaks detect --config .gitleaks.toml --no-git --verbose --redact

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --pull --tag <name>:${{ github.sha }} .

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag <name>:${{ github.sha }} .
      - name: Start worker
        run: |
          cp .env.example .env
          mkdir -p data
          docker run -d --name <name>-test -v "$PWD/data:/app/data" --env-file .env <name>:${{ github.sha }}
          echo "Waiting for heartbeat..."
          for i in $(seq 1 30); do
            if docker exec <name>-test test -f /app/data/heartbeat; then
              echo "heartbeat after ${i}s"; break
            fi
            sleep 1
            if [ "$i" = "30" ]; then docker logs <name>-test; exit 1; fi
          done
      - name: Run qa_check.py
        run: docker exec <name>-test python3 /app/qa_check.py
      - name: Verify perf logs were emitted
        run: |
          docker logs <name>-test | grep -q '<name>-perf' || {
            echo "no perf logs found — worker did not emit structured timing"; exit 1;
          }
      - name: Teardown
        if: always()
        run: |
          docker logs --tail 200 <name>-test || true
          docker rm -f <name>-test || true
