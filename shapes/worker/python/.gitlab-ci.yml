# .gitlab-ci.yml — automated pipeline for <name> (shape: worker)
#
# test:e2e differs from the service shape: instead of hitting /health, the job
# starts the worker, waits for the heartbeat file to appear, optionally injects
# test work, runs qa_check.py inside the container, then tears down.

stages:
  - lint
  - secret-scan
  - security
  - build
  - test

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  PYTHON_IMAGE: python:3.12-slim
  DOCKER_IMAGE: docker:27
  DIND_IMAGE: docker:27-dind

default:
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure, api_failure]
  timeout: 20 minutes

lint:python:
  stage: lint
  image: $PYTHON_IMAGE
  rules:
    - exists: ["**/*.py"]
  before_script:
    - pip install --quiet --no-cache-dir ruff
  script:
    - 'ruff check . || echo "WARN: ruff found issues"'
  allow_failure: true

# Cheap drift checks: a locale missing a key, or an .env.example that no
# longer matches the config module. Neither is visible to lint or typecheck,
# and both are broken deploys waiting to happen. Stdlib-only, so no install.
lint:drift checks:
  stage: lint
  image: python:3.12-slim
  script:
    - python3 scripts/check_locales.py
    - python3 scripts/check_root_clutter.py
  allow_failure: false

secret-scan:gitleaks:
  stage: secret-scan
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --config .gitleaks.toml --redact --verbose --no-banner

# Dependency vulnerabilities, as distinct from committed secrets (which
# gitleaks covers above). allow_failure so a fresh scaffold is never born red
# and an advisory published overnight never blocks an unrelated merge —
# tighten this once you have triaged the initial findings.
security:audit:
  stage: security
  image: $DOCKER_IMAGE
  services:
    - name: $DIND_IMAGE
      alias: docker
  before_script:
    - apk add --no-cache make
  script:
    - make audit
  allow_failure: true

build:docker:
  stage: build
  image: $DOCKER_IMAGE
  services:
    - name: $DIND_IMAGE
      alias: docker
  variables:
    IMAGE_TAG: "${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA}"
  script:
    - docker build --pull --tag "$IMAGE_TAG" .
    - docker save "$IMAGE_TAG" -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 day

test:worker:
  stage: test
  image: $DOCKER_IMAGE
  services:
    - name: $DIND_IMAGE
      alias: docker
  needs:
    - job: build:docker
      artifacts: true
  before_script:
    - apk add --no-cache docker-compose python3
    - docker load -i image.tar
    - cp .env.example .env
  script:
    - docker compose up -d
    - echo "Waiting for heartbeat file to appear…"
    - |
      for i in $(seq 1 30); do
        if docker compose exec -T <name> test -f /app/data/heartbeat; then
          echo "heartbeat appeared after ${i}s"; break
        fi
        sleep 1
        if [ "$i" = "30" ]; then
          echo "worker did not touch heartbeat within 30s"
          docker compose logs; exit 1
        fi
      done
    - echo "Running qa_check.py inside the worker container…"
    - docker compose exec -T <name> python3 /app/qa_check.py
    - echo "Verifying perf logs were emitted…"
    - docker compose logs <name> | grep -q '<name>-perf' || { echo "no perf logs found — worker did not emit structured timing"; exit 1; }
  after_script:
    - docker compose logs --tail 200 || true
    - docker compose down --volumes --remove-orphans || true
