services:
  <name>:
    build:
      context: .
      args:
        APP_UID: ${HOST_UID:-1000}
        APP_GID: ${HOST_GID:-1000}
        VERSION: ${VERSION:-0.0.0-dev}
    image: <name>:latest
    container_name: <name>
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    env_file: .env
    volumes:
      - ./data:/app/data:z
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    mem_limit: 512m
    cpus: 2
    # No ports — workers are not reachable from outside.
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs'); try { const age=(Date.now()-fs.statSync('/app/data/heartbeat').mtimeMs)/1000; process.exit(age<60?0:1); } catch { process.exit(1); }"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
