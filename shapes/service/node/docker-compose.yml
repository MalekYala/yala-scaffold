services:
  <name>:
    build:
      context: .
      args:
        APP_UID: ${HOST_UID:-1000}
        APP_GID: ${HOST_GID:-1000}
        VERSION: ${VERSION:-0.0.0-dev}
    image: <name>:latest
    container_name: <name>
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    env_file: .env
    ports:
      # Bind to localhost only — operators handle external access via their reverse proxy
      - "127.0.0.1:${PORT:-<PORT>}:${PORT:-<PORT>}"
    volumes:
      - ./data:/app/data:z
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    mem_limit: 512m
    cpus: 2
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:${PORT:-<PORT>}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
