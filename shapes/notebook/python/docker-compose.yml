services:
  <name>:
    build:
      context: .
      target: runtime
      args:
        APP_UID: "${HOST_UID:-1000}"
        APP_GID: "${HOST_GID:-1000}"
        VERSION: "${VERSION:-0.0.0-dev}"
    image: <name>:latest
    container_name: <name>
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    restart: unless-stopped
    env_file: .env
    environment:
      JUPYTER_TOKEN: "${JUPYTER_TOKEN:-}"
    ports:
      - "127.0.0.1:${PORT:-<PORT>}:${PORT:-<PORT>}"
    volumes:
      - ./notebooks:/app/notebooks:Z
      - ./data:/app/data:Z
      - ./outputs:/app/outputs:Z
    mem_limit: 4g
    cpus: 4
