# .gitlab-ci.yml — automated pipeline for <name> (shape: notebook)
#
# Runs `nbconvert --execute` on every .ipynb in notebooks/ so regressions
# in exploration code are caught in CI. Uploads executed notebooks as
# artifacts so reviewers can download them and see the actual outputs.

stages:
  - lint
  - secret-scan
  - security
  - build
  - test

variables:
  # Runner tag for every job (see default.tags). Empty = any runner, e.g.
  # GitLab.com shared runners. Set YALA_CI_TAG when scaffolding, or as a
  # project CI/CD variable, to pin jobs to a Docker-executor runner.
  YALA_CI_TAG: "<CI_TAG>"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  PYTHON_IMAGE: python:3.12-slim
  DOCKER_IMAGE: docker:27
  DIND_IMAGE: docker:27-dind

default:
  # Expands to [] when YALA_CI_TAG is empty, so untagged runners still match.
  tags: ["$YALA_CI_TAG"]
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure, api_failure]
  timeout: 30 minutes

lint:python:
  stage: lint
  image: $PYTHON_IMAGE
  rules:
    - exists: ["**/*.py", "**/*.ipynb"]
  before_script:
    - pip install --quiet --no-cache-dir ruff
  script:
    - 'ruff check . || echo "WARN: ruff found issues"'
  allow_failure: true

# Cheap drift checks: a locale missing a key, or an .env.example that no
# longer matches the config module. Neither is visible to lint or typecheck,
# and both are broken deploys waiting to happen. Stdlib-only, so no install.
lint:drift checks:
  stage: lint
  image: python:3.12-slim
  script:
    - python3 scripts/check_locales.py
    - python3 scripts/check_root_clutter.py
  allow_failure: false

secret-scan:gitleaks:
  stage: secret-scan
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --config .gitleaks.toml --redact --verbose --no-banner

# Dependency vulnerabilities, as distinct from committed secrets (which
# gitleaks covers above). allow_failure so a fresh scaffold is never born red
# and an advisory published overnight never blocks an unrelated merge —
# tighten this once you have triaged the initial findings.
security:audit:
  stage: security
  image: $DOCKER_IMAGE
  services:
    - name: $DIND_IMAGE
      alias: docker
  before_script:
    - apk add --no-cache make
  script:
    - make audit
  allow_failure: true

build:docker:
  stage: build
  image: $DOCKER_IMAGE
  services:
    - name: $DIND_IMAGE
      alias: docker
  variables:
    IMAGE_TAG: "${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA}"
  script:
    - docker build --pull --tag "$IMAGE_TAG" .
    - docker save "$IMAGE_TAG" -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 day

test:execute-notebooks:
  stage: test
  image: $DOCKER_IMAGE
  services:
    - name: $DIND_IMAGE
      alias: docker
  needs:
    - job: build:docker
      artifacts: true
  variables:
    IMAGE_TAG: "${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA}"
  before_script:
    - apk add --no-cache python3 py3-pip
    - docker load -i image.tar
    - cp .env.example .env
    - mkdir -p outputs
  script:
    - echo "Executing all notebooks via nbconvert…"
    - |
      docker run --rm \
        -v "$PWD/notebooks:/app/notebooks" \
        -v "$PWD/data:/app/data" \
        -v "$PWD/outputs:/app/outputs" \
        --env-file .env \
        --entrypoint sh "$IMAGE_TAG" -c '
          cd /app && \
          for nb in $(find notebooks -name "*.ipynb"); do
            echo "Executing $nb"
            jupyter nbconvert --to notebook --execute "$nb" --output-dir /app/outputs --ExecutePreprocessor.timeout=120 || exit 1
          done
        '
    - echo "Executed notebooks:"
    - ls -la outputs/
  artifacts:
    when: always
    name: "$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-notebooks"
    paths:
      - outputs/
    expire_in: 2 weeks
