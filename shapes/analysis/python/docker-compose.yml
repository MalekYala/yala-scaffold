services:
  <name>:
    build:
      context: .
      target: runtime
      args:
        APP_UID: "${HOST_UID:-1000}"
        APP_GID: "${HOST_GID:-1000}"
        VERSION: "${VERSION:-0.0.0-dev}"
    image: <name>:latest
    container_name: <name>
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    # One-shot — runs to completion, does not restart
    restart: "no"
    env_file: .env
    volumes:
      # Real data lives outside the repo (operator-supplied via DATA_PATH)
      - ${DATA_PATH:-./data}:/app/data:ro,Z
      # Fixtures (committed sample data for CI and local dev)
      - ./fixtures:/app/fixtures:ro,Z
      # Outputs — PDFs, CSVs, graphs, etc. Captured as CI artifacts.
      - ./outputs:/app/outputs:Z
      - ./results:/app/results:Z
    mem_limit: 2g
    cpus: 4
    # No ports, no healthcheck — analysis projects run and exit.
