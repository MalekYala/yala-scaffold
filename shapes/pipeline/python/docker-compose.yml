services:
  <name>:
    build:
      context: .
      target: runtime
      args:
        APP_UID: "${HOST_UID:-1000}"
        APP_GID: "${HOST_GID:-1000}"
        VERSION: "${VERSION:-0.0.0-dev}"
    image: <name>:latest
    container_name: <name>
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    # Pipelines are typically scheduled (cron / CI / operator trigger), not
    # long-running. Use restart: "no" so a one-shot run exits cleanly.
    restart: "no"
    env_file: .env
    volumes:
      - ${DATA_PATH:-./data}:/app/data:ro,Z
      - ./fixtures:/app/fixtures:ro,Z
      - ./state:/app/state:Z
      - ./outputs:/app/outputs:Z
    mem_limit: 2g
    cpus: 4
