stages: [lint, security, build, test]

variables:
  # Runner tag for every job (see default.tags). Empty = any runner, e.g.
  # GitLab.com shared runners. Set YALA_CI_TAG when scaffolding, or as a
  # project CI/CD variable, to pin jobs to a Docker-executor runner.
  YALA_CI_TAG: "<CI_TAG>"

default:
  # Expands to [] when YALA_CI_TAG is empty, so untagged runners still match.
  tags: ["$YALA_CI_TAG"]

lint:
  image: python:3.12-slim
  stage: lint
  script:
    - pip install --quiet -r requirements.txt -r requirements-dev.txt
    - ruff check .
    - ruff format --check .
    - mypy .

build:
  image: docker:27
  services: [docker:27-dind]
  stage: build
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build --target runtime --tag "<name>:${CI_COMMIT_SHORT_SHA}" .

test:
  image: docker:27
  services: [docker:27-dind]
  stage: test
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build --target test --tag "<name>-test:${CI_COMMIT_SHORT_SHA}" .
    - docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m "<name>-test:${CI_COMMIT_SHORT_SHA}"

# Dependency vulnerabilities, as distinct from committed secrets (which
# gitleaks covers above). allow_failure so a fresh scaffold is never born red
# and an advisory published overnight never blocks an unrelated merge —
# tighten this once you have triaged the initial findings.
security:audit:
  stage: security
  image: $DOCKER_IMAGE
  services:
    - name: $DIND_IMAGE
      alias: docker
  before_script:
    - apk add --no-cache make
  script:
    - make audit
  allow_failure: true

# Cheap drift checks: a locale missing a key, or an .env.example that no
# longer matches the config module. Neither is visible to lint or typecheck,
# and both are broken deploys waiting to happen. Stdlib-only, so no install.
lint:drift checks:
  stage: lint
  image: python:3.12-slim
  script:
    - python3 scripts/check_locales.py
    - python3 scripts/check_root_clutter.py
  allow_failure: false

