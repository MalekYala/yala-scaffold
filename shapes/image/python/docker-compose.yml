services:
  <name>:
    build:
      context: .
      target: runtime
      args:
        APP_UID: "${HOST_UID:-1000}"
        APP_GID: "${HOST_GID:-1000}"
        VERSION: "${VERSION:-0.0.0-dev}"
    image: <name>:latest
    container_name: <name>
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${PORT:-<PORT>}:${PORT:-<PORT>}"
    mem_limit: 768m
    cpus: 2
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:${PORT:-<PORT>}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
